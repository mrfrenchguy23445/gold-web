<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Gold-Web</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="brand" aria-label="Gold-Web">GOLD-WEB</header>

      <form id="search-form" class="search" role="search">
        <input
          id="search-input"
          class="search__input"
          type="text"
          name="q"
          placeholder="Search the web"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          aria-label="Search the web"
        />
      </form>

      <section class="bookmarks" id="bookmarks" aria-label="Bookmarks" hidden></section>

      <section class="grid" id="shortcuts" aria-label="Shortcuts"></section>
    </main>

    <dialog id="add-dialog" class="dialog">
      <form id="add-form" method="dialog">
        <h2 class="dialog__title">Add shortcut</h2>
        <label class="dialog__field">
          <span>Name</span>
          <input id="add-name" type="text" required maxlength="40" autocomplete="off" />
        </label>
        <label class="dialog__field">
          <span>Address</span>
          <input id="add-url" type="text" required autocomplete="off" placeholder="mrfrench.com" />
        </label>
        <div class="dialog__actions">
          <button type="button" class="btn btn--ghost" id="add-cancel">Cancel</button>
          <button type="submit" class="btn btn--primary" id="add-save">Add</button>
        </div>
      </form>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
